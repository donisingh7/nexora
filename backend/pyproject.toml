[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexora-backend"
version = "0.1.0"
description = "Nexora enterprise knowledge intelligence backend: hybrid retrieval, grounded QA"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2.0",
  "asyncpg>=0.29,<1.0",
  "fastapi>=0.115,<1.0",
  "pgvector>=0.3,<1.0",
  "pypdf>=5,<7",
  "pydantic-settings>=2.5,<3.0",
  "python-docx>=1.1,<2.0",
  "python-multipart>=0.0.9,<1.0",
  "rank-bm25>=0.2,<1.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "structlog>=24.4,<26.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
providers = [
  "boto3>=1.34,<2.0",
  "groq>=0.11,<1.0",
  "sentence-transformers>=3.0,<6.0",
  "google-genai>=1.0,<2.0",
]
aws = [
  "mangum>=0.17,<1.0",
]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<2.0",
  "ruff>=0.7,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
